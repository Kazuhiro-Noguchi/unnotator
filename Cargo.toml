[workspace]
members = [
  "crates/core",
  "crates/extensions",
  "crates/worker",
  "src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99.1"

# 外部クレートの版はここだけに書く。各クレートは `workspace = true` で参照する。
[workspace.dependencies]
# 共通
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# core（テストと 002 以降の本体）
rusqlite = { version = "0.43.0", features = ["bundled"] }
# アプリ（src-tauri だけが使う）
tauri = { version = "2.12.7", features = [] }
tauri-build = { version = "2.7.6", features = [] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.28"
specta-typescript = "=0.0.15"

[workspace.lints.clippy]
unwrap_used = "deny"
