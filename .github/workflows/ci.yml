# 3 OS（Linux・macOS・Windows）で、確認コマンドと、`unno://` の自己診断を回す（001 の T045）。
name: ci

on:
  pull_request:

# 読み取りだけ。外部からの PR でも、秘密情報は使わない
permissions:
  contents: read

# CI のビルドを速く・キャッシュを小さくする（増分ビルドの情報とデバッグ情報は、CI では使わない）
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      # Windows のチェックアウトで、改行が LF から CRLF に変わらないようにする（Biome の検査が通らなくなる）
      - name: 改行を変換しない
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Linux の依存（Tauri）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev xvfb

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Rust の版は rust-toolchain.toml で決まる（rustup が自動で入れる）
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm schema:check
      # clippy の指摘は OS で変わらないので、Linux だけで実行する（macOS・Windows のビルドの時間を省く）
      - name: cargo clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # テスト用の実行ファイルを並列に走らせる（Windows は実行ファイルごとの起動が遅い）。
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace

      # 実機の WebView での `unno://` の診断（S-01）。同じジョブで続けて動かし、ビルドの成果物を使い回す。
      # 結果は標準出力の UNNO_SELFTEST_RESULT。失敗は、ジョブの失敗になる（終了コードが 0 でなければ）。
      - name: unno:// 自己診断（Linux・画面なし）
        if: runner.os == 'Linux'
        shell: bash
        env:
          UNNOTATOR_SELFTEST: unno
        run: xvfb-run -a pnpm exec tauri dev 2>&1 | tee selftest.log
      - name: unno:// 自己診断（macOS・Windows）
        if: runner.os != 'Linux'
        shell: bash
        env:
          UNNOTATOR_SELFTEST: unno
        run: pnpm exec tauri dev 2>&1 | tee selftest.log
      - name: 自己診断の結果
        if: always()
        shell: bash
        run: grep "UNNO_SELFTEST_RESULT" selftest.log || echo "結果の行が出ていない"
